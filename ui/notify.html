<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Encore notifications</title>
<!-- Drawn in Encore's notification window: transparent, click-through, never recorded.
     Up to three at once. Corners, top and bottom centre: the hologram card, its timer line on the
     side facing into the screen. Middle of the left or right edge: the edge tab. -->
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font: 14px/1.35 "Segoe UI", system-ui, sans-serif; color: #e2e1e4; user-select: none; cursor: default; }
  svg { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }

  #stack { position: absolute; inset: 0; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  #stack.top { justify-content: flex-start; }
  #stack.bottom { justify-content: flex-end; }
  #stack.mid { justify-content: center; }
  #stack.left { align-items: flex-start; }
  #stack.right { align-items: flex-end; }
  #stack.centre { align-items: center; }
  #stack.tab.left { padding-left: 0; }
  #stack.tab.right { padding-right: 0; }

  .n { --c: #b4bbff; --line: rgba(138, 150, 255, .55); --glow: rgba(88, 101, 242, .45);
       position: relative; box-sizing: border-box; background: rgba(16, 15, 26, .88); border: 1px solid var(--line);
       box-shadow: 0 0 20px var(--glow), inset 0 0 16px rgba(255, 255, 255, .03); overflow: hidden;
       transition: opacity .22s ease, transform .22s cubic-bezier(.2, .8, .2, 1); }
  .n.red { --c: #ff8a8e; --line: rgba(255, 120, 124, .55); --glow: rgba(242, 63, 67, .42); }
  .n.green { --c: #6fdc8c; --line: rgba(111, 220, 140, .5); --glow: rgba(35, 165, 90, .42); }
  .n.purple { --c: #c3b4ff; --line: rgba(170, 140, 255, .5); --glow: rgba(130, 100, 255, .42); }
  .n.amber { --c: #ffd27a; --line: rgba(240, 178, 50, .55); --glow: rgba(240, 178, 50, .36); }

  /* hologram card */
  .card { width: 360px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; }
  .ic { flex: none; width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--c); }
  .ic svg { width: 22px; height: 22px; stroke-width: 1.7; filter: drop-shadow(0 0 3px var(--glow)); }
  .tx { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .t { font-size: 14px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s { font-size: 12.5px; color: #b3b2bd; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .tm { position: absolute; left: 12px; right: 12px; height: 2px; border-radius: 1px; background: var(--c); box-shadow: 0 0 6px var(--glow); transform-origin: left; }
  .top .card .tm { bottom: 0; }
  .bottom .card .tm { top: 0; }

  /* edge tab */
  .tab .n { width: 320px; padding: 11px 16px 12px 20px; display: flex; flex-direction: column; gap: 2px; }
  .tab.right .n { border-radius: 10px 0 0 10px; border-right: 0; }
  .tab.left .n { border-radius: 0 10px 10px 0; border-left: 0; padding: 11px 20px 12px 16px; }
  .tab .n .k { font-size: 11.5px; font-weight: 600; color: var(--c); }
  .tab .n .tm, .tab .n .rail { position: absolute; top: 0; bottom: 0; width: 4px; }
  .tab.right .n .tm, .tab.right .n .rail { left: 0; }
  .tab.left .n .tm, .tab.left .n .rail { right: 0; }
  .tab .n .rail { background: rgba(255, 255, 255, .06); }
  .tab .n .tm { background: var(--c); box-shadow: 0 0 8px var(--glow); transform-origin: bottom; }

  @keyframes drainX { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  @keyframes drainY { from { transform: scaleY(1); } to { transform: scaleY(0); } }

  /* coming in and going out, from the edge it sits against */
  .n.in { opacity: 0; }
  .top .n.in { transform: translateY(-10px); }
  .bottom .n.in { transform: translateY(10px); }
  .tab.right .n.in { transform: translateX(40px); }
  .tab.left .n.in { transform: translateX(-40px); }
  .n.out { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .n { transition: opacity .15s linear; transform: none !important; } .tm { animation: none !important; } }
</style>
</head>
<body>
<div id="stack" class="top right"></div>
<script>
(() => {
  const MAX = 3;
  const stack = document.getElementById('stack');
  const tauri = window.__TAURI__;
  const icons = {
    echo: '<path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/><path d="M12 8v4l3 2"/>',
    record: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/>',
    saved: '<path d="M20 6 9 17l-5-5"/>',
    game: '<path d="M7 9h10a4 4 0 0 1 4 4v1.5a2.5 2.5 0 0 1-4.5 1.5L15 14H9l-1.5 2A2.5 2.5 0 0 1 3 14.5V13a4 4 0 0 1 4-4z"/><path d="M8 11.5v2M7 12.5h2M15.5 12h.01M17.5 13h.01"/>',
    problem: '<path d="M12 3.5 2.5 20h19L12 3.5z"/><path d="M12 10v4.5M12 17.2h.01"/>',
  };
  const tones = { echo: 'blue', record: 'red', saved: 'green', game: 'purple', problem: 'amber' };
  const kinds = { echo: 'Echoes', record: 'Recording', saved: 'Recording', game: 'Game detection', problem: 'Encore' };
  let pos = 'tr';
  const live = []; // newest last

  function layout(p) {
    pos = p;
    const v = p[0] === 't' ? 'top' : p[0] === 'b' ? 'bottom' : 'mid';
    const h = p[1] === 'l' ? 'left' : p[1] === 'r' ? 'right' : 'centre';
    const tab = p === 'ml' || p === 'mr';
    stack.className = `${v} ${h}${tab ? ' tab' : ''}`;
    // The newest sits nearest the screen edge: first at the top, last at the bottom.
    const order = v === 'bottom' ? live : [...live].reverse();
    for (const n of order) stack.appendChild(n.el);
  }

  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function make(item) {
    const kind = icons[item.kind] ? item.kind : 'problem';
    const tab = pos === 'ml' || pos === 'mr';
    const secs = Math.max(2, Math.min(10, Number(item.seconds) || 5));
    const el = document.createElement('div');
    el.className = `n ${tones[kind]} in${tab ? '' : ' card'}`;
    el.innerHTML = tab
      ? `<span class="rail"></span><span class="tm" style="animation: drainY ${secs}s linear forwards"></span>
         <span class="k">${esc(kinds[kind])}</span><span class="t">${esc(item.title)}</span>${item.text ? `<span class="s">${esc(item.text)}</span>` : ''}`
      : `<div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[kind]}</svg></div>
         <div class="tx"><span class="t">${esc(item.title)}</span>${item.text ? `<span class="s">${esc(item.text)}</span>` : ''}</div>
         <span class="tm" style="animation: drainX ${secs}s linear forwards"></span>`;
    return { el, secs };
  }

  function remove(n) {
    const i = live.indexOf(n);
    if (i < 0) return;
    live.splice(i, 1);
    clearTimeout(n.timer);
    n.el.classList.add('out');
    setTimeout(() => {
      n.el.remove();
      if (!live.length && !stack.children.length) tauri.core.invoke('notifications_idle').catch(() => {});
    }, 260);
  }

  function show({ pos: p, item }) {
    if (p !== pos) {
      // Moved to another spot: start afresh there.
      for (const n of [...live]) { clearTimeout(n.timer); n.el.remove(); }
      live.length = 0;
    }
    layout(p);
    while (live.length >= MAX) remove(live[0]);
    const n = make(item);
    live.push(n);
    layout(p);
    requestAnimationFrame(() => requestAnimationFrame(() => n.el.classList.remove('in')));
    n.timer = setTimeout(() => remove(n), n.secs * 1000);
  }

  if (tauri && tauri.event) tauri.event.listen('notify', (e) => show(e.payload));
})();
</script>
</body>
</html>
