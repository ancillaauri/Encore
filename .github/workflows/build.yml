name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a test release with this tag (e.g. v0.1.0). Leave empty to just build.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch FFmpeg (LGPL, 8.1 or newer, must have gfxcapture)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci-step.ps1 -Always -Lines 40 -Title "FFmpeg" -Run "./scripts/fetch-ffmpeg.ps1"

      - name: Engine tests
        shell: pwsh
        run: ./scripts/ci-step.ps1 -Title "Engine tests" -Run "cargo test -p encore-engine"

      - name: Build engine
        shell: pwsh
        run: ./scripts/ci-step.ps1 -Title "Build engine" -Run "cargo build --release -p encore-engine"

      - name: Stage engine for bundling
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item target/release/encore-engine.exe src-tauri/binaries/encore-engine-x86_64-pc-windows-msvc.exe

      - name: Engine self-test (diagnostic only; build machines have no GPU)
        continue-on-error: true
        shell: pwsh
        run: ./scripts/ci-step.ps1 -Always -Lines 80 -Title "Engine self-test" -Run "./target/release/encore-engine.exe --selftest --ffmpeg src-tauri/resources/ffmpeg.exe --selftest-capture $env:RUNNER_TEMP/selftest.mkv"

      - name: Install app build tools
        run: npm ci

      - name: Update signing check
        id: signing
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            "enabled=true" >> $env:GITHUB_OUTPUT
          } else {
            # Without the key, build anyway but without update files (auto-update needs signed builds).
            $c = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
            $c.bundle.createUpdaterArtifacts = $false
            $c | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json -Encoding utf8NoBOM
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "::warning title=Updates not signed::The TAURI_SIGNING_PRIVATE_KEY secret is missing, so this build cannot be delivered as an automatic update."
          }

      - name: Build app and installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: ./scripts/ci-step.ps1 -Lines 80 -Title "App build" -Run "npx tauri build"

      - name: Update manifest (latest.json)
        if: steps.signing.outputs.enabled == 'true' && github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        run: ./scripts/ci-step.ps1 -Always -Lines 20 -Title "Update manifest" -Run "./scripts/make-latest-json.ps1 -Tag ${{ inputs.release_tag }} -Repo ${{ github.repository }}"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Encore-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Publish release (tags, or a manual run with a release tag)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Encore ${{ inputs.release_tag || github.ref_name }} (test build)
          target_commitish: ${{ github.sha }}
          files: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            target/release/bundle/nsis/latest.json
          # Published as the latest release so installed copies can find the update.
          prerelease: false
          make_latest: true
          body_path: RELEASE_NOTES.md
